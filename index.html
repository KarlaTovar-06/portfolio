<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/starticon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karla Tovar | Portfolio</title>
    <meta name="description" content="Portfolio de Karla Tovar — Software Developer especializada en desarrollo web, mobile y/cloud. Proyectos, experiencia y certificaciones." />
    <script>
      try {
        var stored = localStorage.getItem("theme");
        var isLight =
          stored === "light" ||
          (!stored && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.classList.toggle("dark", !isLight);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
