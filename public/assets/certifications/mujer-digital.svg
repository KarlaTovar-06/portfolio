<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgMujer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D73961"/>
      <stop offset="100%" stop-color="#a82a4a"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bgMujer)"/>
  <g transform="translate(160 105)">
    <!-- Stylized woman silhouette (shoulders + head) -->
    <circle cx="0" cy="-30" r="22" fill="#ffffff"/>
    <path d="M -45 40 Q -45 0 -22 -10 L 22 -10 Q 45 0 45 40 Z" fill="#ffffff"/>
    <!-- Hair -->
    <path d="M -20 -38 Q -22 -52 -10 -52 Q 0 -56 10 -52 Q 22 -52 20 -38 Q 20 -28 16 -25 L -16 -25 Q -20 -28 -20 -38 Z" fill="#1f1f1f"/>
    <!-- Circuit lines (digital) -->
    <g stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="-55" y1="-30" x2="-40" y2="-30"/>
      <line x1="-40" y1="-30" x2="-40" y2="-15"/>
      <circle cx="-55" cy="-30" r="3" fill="#fbbf24"/>
      <line x1="40" y1="-30" x2="55" y2="-30"/>
      <line x1="40" y1="-30" x2="40" y2="-10"/>
      <circle cx="55" cy="-30" r="3" fill="#fbbf24"/>
    </g>
    <!-- Code brackets on shoulders -->
    <text x="-30" y="35" font-family="ui-monospace, monospace" font-size="16" font-weight="800" fill="#D73961">&lt;/&gt;</text>
  </g>
  <text x="160" y="195" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="3">MUJER DIGITAL</text>
</svg>
